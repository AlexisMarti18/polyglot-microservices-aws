# Se instala como /etc/nginx/conf.d/default.conf y reemplaza al server por defecto de la imagen
# (que escucha en el puerto 80). Solo existe este server: HTTPS en 8443, sin HTTP en ningun puerto.

# Limite de pedidos por IP para las APIs: 10 por segundo, con rafagas de hasta 20. Evita que un
# cliente sature los contenedores o la API externa de tipo de cambio (cada POST/PUT de pagos la
# consulta). $binary_remote_addr ocupa 4 bytes por IP: 10 MB alcanzan para ~160.000 IPs.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

# Limite de conexiones simultaneas por IP (en HTTP/2 cada pedido en curso cuenta como una).
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
limit_conn_status 429;

server {
    # 8443 y no 443: NGINX corre como usuario no-root y los puertos < 1024 requieren privilegios.
    listen       8443 ssl;
    http2        on;
    server_name  _;
    server_tokens off;

    # Certificado autofirmado generado al arrancar el contenedor (ver 40-generar-certificado.sh).
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Para TLS 1.2, solo cifrados con forward secrecy (ECDHE) y cifrado autenticado (GCM o
    # ChaCha20). Sin esta lista NGINX acepta tambien CBC, Camellia e intercambio RSA sin forward
    # secrecy. Los cifrados de TLS 1.3 son todos seguros y no se configuran aca.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Si alguien habla HTTP plano contra este puerto, NGINX responde 400 y no sirve nada.

    # DNS interno de Docker. Con "set $upstream" + resolver, NGINX resuelve el nombre de cada API
    # en cada pedido y no al arrancar: puede levantar aunque alguna API todavia no exista
    # (responde 502 para esa ruta) y sigue funcionando si un contenedor se recrea con otra IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Las APIs solo reciben JSON chico; esto corta bodies enormes antes de llegar a ellas (413).
    client_max_body_size 64k;

    # Timeouts cortos (por defecto son 60-65 s): un cliente que abre conexiones y manda los datos
    # de a poco (ataque "slowloris") no puede dejarlas ocupadas, y el limite por IP acota cuantas abre.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     10s;
    limit_conn conexiones 20;

    # Cabeceras de seguridad para todas las respuestas ("always" las agrega tambien en errores).
    # Ojo: si un location define su propio add_header, deja de heredar estas.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Cabeceras que reciben las APIs (se heredan en los location de /api porque no definen otras).
    # X-Forwarded-For lleva solo la IP real de la conexion: NGINX es el borde, asi que cualquier
    # X-Forwarded-For que mande el cliente es inventado y se descarta.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Errores generados por NGINX (API caida, body grande, rate limit, etc.): cuerpo generico en
    # JSON en lugar de la pagina por defecto, que dice "nginx". Se conserva el codigo original.
    # Los errores que devuelven las APIs pasan sin tocar.
    error_page 400 403 404 405 413 429 500 502 503 504 /_error.json;
    # 497 es el codigo interno de NGINX para "HTTP plano contra el puerto HTTPS": se responde 400.
    error_page 497 =400 /_error.json;
    location = /_error.json {
        internal;
        alias /etc/nginx/error.json;
    }

    # Frontend: el build de Vite (dist/).
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite agrega un hash al nombre de cada asset, asi que se pueden cachear sin vencimiento.
    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    # Archivos ocultos (.env, .git, .htaccess...): nunca se sirven. No hay ninguno en dist/, pero
    # la regla evita exponerlos si alguna vez se cuela uno.
    location ~ /\. {
        return 404;
    }

    # Cada /api/<servicio> se reenvia al contenedor de ESE microservicio. Los nombres de
    # upstream (api-clientes, api-pagos, etc.) tienen que coincidir con el nombre del servicio
    # en el docker-compose.yml. Las APIs hablan HTTP puro dentro de la red interna de Docker.
    # limit_except: solo pasan los metodos del ABM (GET incluye HEAD); el resto recibe 403.
    location /api/clientes {
        limit_req zone=api burst=20 nodelay;
        limit_except GET POST PUT DELETE { deny all; }
        set $upstream api-clientes:8080;
        rewrite ^/api/clientes(.*)$ /clientes$1 break;
        proxy_pass http://$upstream;
    }

    location /api/pagos {
        limit_req zone=api burst=20 nodelay;
        limit_except GET POST PUT DELETE { deny all; }
        set $upstream api-pagos:8080;
        rewrite ^/api/pagos(.*)$ /pagos$1 break;
        proxy_pass http://$upstream;
    }

    location /api/facturas {
        limit_req zone=api burst=20 nodelay;
        limit_except GET POST PUT DELETE { deny all; }
        set $upstream api-facturas:8080;
        rewrite ^/api/facturas(.*)$ /facturas$1 break;
        proxy_pass http://$upstream;
    }

    location /api/transacciones {
        limit_req zone=api burst=20 nodelay;
        limit_except GET POST PUT DELETE { deny all; }
        set $upstream api-transacciones:8080;
        rewrite ^/api/transacciones(.*)$ /transacciones$1 break;
        proxy_pass http://$upstream;
    }

    location /api/tarjetas {
        limit_req zone=api burst=20 nodelay;
        limit_except GET POST PUT DELETE { deny all; }
        set $upstream api-tarjetas:8080;
        rewrite ^/api/tarjetas(.*)$ /tarjetas$1 break;
        proxy_pass http://$upstream;
    }
}
