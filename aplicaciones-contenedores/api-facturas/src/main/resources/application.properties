# Esta API se conecta a "db_facturas", UNA de las 5 bases que viven en la MISMA instancia
# compartida de MariaDB (ver tp-2026/db).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_facturas}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}

# La tabla ya la crean los scripts de db/init-scripts, asi que Hibernate no debe tocar el esquema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
